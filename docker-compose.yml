services:
  veripact:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veripact
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PAYPAL_ENV=sandbox
    volumes:
      - veripact_data:/app/data
    restart: unless-stopped

volumes:
  veripact_data:
