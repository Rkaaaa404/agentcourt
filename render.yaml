services:
  - type: web
    name: agentcourt
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: PAYPAL_BUYER_PASSWORD
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-3-5-sonnet-20241022
      - key: LLM_API_KEY
        sync: false
      - key: REGRET_THRESHOLD
        value: "0.15"
      - key: DATABASE_URL
        value: sqlite:///./agentcourt.db
